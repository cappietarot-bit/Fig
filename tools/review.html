<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fig &middot; verse review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
:root{
  --night:#14121F; --night2:#1C1828; --panel:#221D30; --line:#312942;
  --bone:#E9E1D2; --dim:#9B90A6; --brass:#C9A75E; --keep:#5FB88A; --drop:#8A7F96;
  --sans:"Karla","Helvetica Neue",Arial,sans-serif;
  --book:"Spectral",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--bone);font-family:var(--sans);font-size:15px;line-height:1.5}

header{
  position:sticky;top:0;z-index:20;background:rgba(20,18,31,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-top)) ;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.brand h1{margin:0;font-size:15px;letter-spacing:.02em;font-weight:700}
.brand .sub{font-size:11.5px;color:var(--dim)}
.brand .total{margin-left:auto;font-size:11.5px;color:var(--brass);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;margin-bottom:9px}
.tab{
  flex:1;font-family:var(--sans);font-size:12.5px;font-weight:700;
  padding:9px 6px;border-radius:9px;cursor:pointer;
  background:var(--night2);border:1px solid var(--line);color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tab[aria-selected="true"]{background:var(--brass);border-color:var(--brass);color:var(--night)}
.tab .n{font-size:10.5px;font-weight:400;opacity:.85;font-variant-numeric:tabular-nums}
.tab:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{
  flex:1;min-width:140px;background:var(--night2);border:1px solid var(--line);
  color:var(--bone);border-radius:8px;padding:8px 11px;font-family:var(--sans);font-size:13px;
}
.toolbar input[type=search]::placeholder{color:var(--drop)}
.btn{
  background:var(--night2);border:1px solid var(--line);color:var(--bone);
  border-radius:8px;padding:8px 12px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;
}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--night)}
.btn[aria-pressed="true"]{background:var(--panel);border-color:var(--brass);color:var(--brass)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

main{padding:12px 12px 120px;max-width:820px;margin:0 auto}
.hint{color:var(--dim);font-size:12.5px;margin:2px 2px 12px}

.row{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--night2);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:10px;padding:12px 13px;margin-bottom:8px;cursor:pointer;
  transition:border-color .13s ease, background .13s ease;
}
.row:hover{border-color:#40365A}
.row[data-state="keep"]{border-left-color:var(--keep);background:#1B2622}
.row[data-state="drop"]{opacity:.4;border-left-color:var(--drop)}
.row:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.mark{
  flex:0 0 auto;width:22px;height:22px;border-radius:6px;margin-top:2px;
  border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:transparent;
}
.row[data-state="keep"] .mark{background:var(--keep);border-color:var(--keep);color:#10211A}
.row[data-state="drop"] .mark{border-color:var(--drop);color:var(--drop)}

.body{flex:1;min-width:0}
.meta{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.ref{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brass)}
.score{font-size:10px;color:var(--drop);font-variant-numeric:tabular-nums}
.text{font-family:var(--book);font-size:15.5px;line-height:1.52;margin:0;color:#DED6E0}
.row[data-state="keep"] .text{color:var(--bone)}

.drop-btn{
  flex:0 0 auto;background:none;border:0;color:var(--drop);cursor:pointer;
  font-size:18px;line-height:1;padding:2px 4px;border-radius:6px;
}
.drop-btn:hover{color:#C9788A}
.drop-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.empty{color:var(--dim);text-align:center;padding:50px 20px;font-size:14px}
.more{display:block;width:100%;margin:14px 0 0}

footer{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(20,18,31,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center;
}
footer .count{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
footer .count b{color:var(--keep)}
footer .spacer{flex:1}
.err{
  background:#2E1D22;border:1px solid #6B3A45;color:#F0D6DC;
  border-radius:10px;padding:16px 18px;margin:20px 0;font-size:14px;line-height:1.6;
}
.err code{background:#14121F;padding:2px 6px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Fig</h1>
    <span class="sub">verse review</span>
    <span class="total" id="grandTotal"></span>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Filter by book or word" autocomplete="off">
    <button class="btn" type="button" id="onlyUndecided" aria-pressed="false">Undecided</button>
    <button class="btn" type="button" id="onlyKept" aria-pressed="false">Kept</button>
  </div>
</header>

<main>
  <p class="hint" id="hint">Tap a verse to keep it. Tap the cross to drop it. Everything saves as you go, so you can stop anywhere.</p>
  <div id="list"></div>
  <button class="btn more" type="button" id="moreBtn" hidden>Show 100 more</button>
</main>

<footer>
  <span class="count" id="footCount"></span>
  <span class="spacer"></span>
  <button class="btn" type="button" id="resetBtn">Reset stream</button>
  <button class="btn primary" type="button" id="exportBtn">Export approved</button>
</footer>

<script>
var STORE = 'fig_review_v1';
var PAGE = 100;
var streams = {}, order = [], stream = null, shown = PAGE;
var marks = load();

function load(){
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch(e){ return {}; }
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch(e){}
}

function counts(name){
  var list = streams[name] || [], keep = 0, drop = 0;
  for (var i = 0; i < list.length; i++){
    var m = marks[list[i].ref];
    if (m === 'keep') keep++; else if (m === 'drop') drop++;
  }
  return { keep: keep, drop: drop, total: list.length, left: list.length - keep - drop };
}

function buildTabs(){
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  order.forEach(function(name){
    var c = counts(name);
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', name === stream ? 'true' : 'false');
    b.innerHTML = '<span>' + name.charAt(0).toUpperCase() + name.slice(1) + '</span>' +
                  '<span class="n">' + c.keep + ' kept &middot; ' + c.left + ' left</span>';
    b.addEventListener('click', function(){ stream = name; shown = PAGE; buildTabs(); render(); });
    tabs.appendChild(b);
  });

  var gk = 0, gt = 0;
  order.forEach(function(n){ var c = counts(n); gk += c.keep; gt += c.total; });
  document.getElementById('grandTotal').textContent = gk + ' / ' + gt + ' kept';
  document.getElementById('footCount').innerHTML =
    '<b>' + gk + '</b> kept, about ' + (gk / 3 >= 1 ? Math.round(gk / 3) : 0) + ' days of cards';
}

function visible(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var undec = document.getElementById('onlyUndecided').getAttribute('aria-pressed') === 'true';
  var kept  = document.getElementById('onlyKept').getAttribute('aria-pressed') === 'true';
  return (streams[stream] || []).filter(function(v){
    var m = marks[v.ref];
    if (undec && m) return false;
    if (kept && m !== 'keep') return false;
    if (q && v.text.toLowerCase().indexOf(q) < 0 && v.ref.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function render(){
  var list = document.getElementById('list');
  var rows = visible();
  list.innerHTML = '';

  if (!rows.length){
    list.innerHTML = '<p class="empty">Nothing here. Clear the filters, or this stream is done.</p>';
    document.getElementById('moreBtn').hidden = true;
    return;
  }

  rows.slice(0, shown).forEach(function(v){
    var state = marks[v.ref] || '';
    var row = document.createElement('div');
    row.className = 'row';
    row.tabIndex = 0;
    if (state) row.dataset.state = state;

    var mark = document.createElement('div');
    mark.className = 'mark';
    mark.textContent = state === 'drop' ? '×' : '✓';

    var body = document.createElement('div');
    body.className = 'body';
    var meta = document.createElement('div');
    meta.className = 'meta';
    var ref = document.createElement('span'); ref.className = 'ref'; ref.textContent = v.ref;
    var sc  = document.createElement('span'); sc.className  = 'score'; sc.textContent = 'match ' + v.score;
    meta.appendChild(ref); meta.appendChild(sc);
    var p = document.createElement('p'); p.className = 'text'; p.textContent = v.text;
    body.appendChild(meta); body.appendChild(p);

    var drop = document.createElement('button');
    drop.className = 'drop-btn';
    drop.type = 'button';
    drop.title = 'Drop this verse';
    drop.setAttribute('aria-label', 'Drop ' + v.ref);
    drop.textContent = '×';

    function set(next){
      if (marks[v.ref] === next) delete marks[v.ref]; else marks[v.ref] = next;
      save();
      var s = marks[v.ref] || '';
      if (s) row.dataset.state = s; else row.removeAttribute('data-state');
      mark.textContent = s === 'drop' ? '×' : '✓';
      buildTabs();
    }

    row.addEventListener('click', function(e){
      if (e.target === drop) return;
      set('keep');
    });
    row.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); set('keep'); }
    });
    drop.addEventListener('click', function(e){ e.stopPropagation(); set('drop'); });

    row.appendChild(mark); row.appendChild(body); row.appendChild(drop);
    list.appendChild(row);
  });

  var more = document.getElementById('moreBtn');
  more.hidden = rows.length <= shown;
  more.textContent = 'Show 100 more (' + (rows.length - shown) + ' below)';
}

document.getElementById('moreBtn').addEventListener('click', function(){ shown += PAGE; render(); });
document.getElementById('q').addEventListener('input', function(){ shown = PAGE; render(); });

['onlyUndecided','onlyKept'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(e){
    var b = e.currentTarget;
    var on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', on ? 'false' : 'true');
    if (!on){
      var other = document.getElementById(id === 'onlyKept' ? 'onlyUndecided' : 'onlyKept');
      other.setAttribute('aria-pressed','false');
    }
    shown = PAGE; render();
  });
});

document.getElementById('resetBtn').addEventListener('click', function(){
  if (!confirm('Clear every decision in ' + stream + '? Other streams are untouched.')) return;
  (streams[stream] || []).forEach(function(v){ delete marks[v.ref]; });
  save(); buildTabs(); render();
});

document.getElementById('exportBtn').addEventListener('click', function(){
  var out = { source: 'KJV, public domain', approved: {} };
  var n = 0;
  order.forEach(function(name){
    out.approved[name] = (streams[name] || [])
      .filter(function(v){ return marks[v.ref] === 'keep'; })
      .map(function(v){ return { ref: v.ref, book: v.book, chapter: v.chapter, verse: v.verse, text: v.text }; });
    n += out.approved[name].length;
  });
  if (!n){ alert('Nothing kept yet.'); return; }
  var blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'approved.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
});

fetch('../www/data/candidates.json')
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data){
    streams = data.streams;
    order = Object.keys(streams);
    stream = order[0];
    buildTabs();
    render();
  })
  .catch(function(){
    document.querySelector('main').innerHTML =
      '<div class="err"><b>Could not load the verses.</b><br><br>' +
      'A page opened straight off the disk is not allowed to read a sibling file. ' +
      'Close this tab and start it with <code>review.cmd</code> in the Fig folder instead, ' +
      'which serves the folder and opens the right address.</div>';
  });
</script>
</body>
</html>
